spring.application.name=match-aggregator
spring.datasource.url=jdbc:h2:file:./data/aggregator
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

poller.enabled=true
poller.interval=5s
poller.timeout=2s
poller.provider-b-base-url=http://localhost:8081

logging.level.com.example.matchaggregator.poll=DEBUG